<!DOCTYPE html>
<html lang="{{ lang | default: site.lang }}">
  {% include "head.html" %}
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="site-header-inner">
        <div class="site-brand">
          {% include "brand_mark.html", grad_id: "at-brand-header" %}
          <span class="site-brand-name">
            <span class="swift-kw" style="--n:4" aria-hidden="true"><span class="swift-inner"><span class="ch" style="--i:4">a</span><span class="ch" style="--i:3">c</span><span class="ch" style="--i:2">t</span><span class="ch" style="--i:1">o</span><span class="ch" style="--i:0">r</span></span></span>
            <span class="brand-core"><span class="ch" style="--i:0">A</span><span class="ch" style="--i:1">c</span><span class="ch" style="--i:2">t</span><span class="ch" style="--i:3">o</span><span class="ch" style="--i:4">r</span></span>
            <span class="swift-rest" style="--n:21" aria-hidden="true"><span class="swift-inner"><span class="ch" style="--i:0">{</span><span class="ch" style="--i:1"> </span><span class="ch" style="--i:2">i</span><span class="ch" style="--i:3">s</span><span class="ch" style="--i:4">o</span><span class="ch" style="--i:5">l</span><span class="ch" style="--i:6">a</span><span class="ch" style="--i:7">t</span><span class="ch" style="--i:8">e</span><span class="ch" style="--i:9">(</span><span class="ch" style="--i:10">c</span><span class="ch" style="--i:11">o</span><span class="ch" style="--i:12">m</span><span class="ch" style="--i:13">p</span><span class="ch" style="--i:14">l</span><span class="ch" style="--i:15">e</span><span class="ch" style="--i:16">x</span><span class="ch" style="--i:17">i</span><span class="ch" style="--i:18">t</span><span class="ch" style="--i:19">y</span><span class="ch" style="--i:20">)</span><span class="ch" style="--i:21">}</span></span></span>
          </span>
        </div>
        {% assign latest = releases | where: "isDraft", false | first %}
        <a class="header-download" href="{{ latest.dmgUrl | default: site.release_url }}">
          <span class="header-download-label">Download</span>
          <span class="header-download-version" aria-hidden="true">{{ latest.tag }}</span>
        </a>
      </div>
    </header>

    <main id="content">
      {{ content }}
    </main>

    {% include "footer.html" %}

    <script>
      (function () {
        var pill = document.querySelector(".header-download");
        var hero = document.querySelector(".hero") || document.querySelector("#content");
        if (pill && hero && "IntersectionObserver" in window) {
          var io = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                pill.classList.toggle("is-visible", !entry.isIntersecting);
              });
            },
            { threshold: 0 }
          );
          io.observe(hero);
          window.addEventListener("pagehide", function () { io.disconnect(); }, { once: true });
        }
      })();
    </script>
  </body>
</html>
